{% if clinic_mode %}
<div v-if="globalError" id="global-error-banner"
     class="mx-4 mt-3 flex flex-shrink-0 items-start gap-3 rounded-lg border p-3 sm:ml-auto sm:max-w-md"
     style="background-color: var(--bg-danger-light); border-color: var(--border-danger); color: var(--text-danger-strong);">
    <i class="fas fa-exclamation-circle mt-1 flex-shrink-0 text-xl" aria-hidden="true"></i>
    <div role="alert" class="min-w-0 flex-1 break-words">
        <p class="mb-1 font-semibold" v-text="t('common.error')"></p>
        <p class="text-sm" v-text="globalError"></p>
    </div>
    <button type="button" @click="globalError = null" :aria-label="t('common.close')"
            class="h-12 w-12 flex-shrink-0 rounded-md">
        <i class="fas fa-times" aria-hidden="true"></i>
    </button>
</div>
{% endif %}
